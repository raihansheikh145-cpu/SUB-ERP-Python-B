<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Document{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary-color: {{ company.logoColor | default('#2563eb') }};
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
        }

        .company-info h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
        }
        
        .company-info p {
            margin: 2px 0;
            color: var(--text-muted);
        }

        .doc-title {
            text-align: right;
        }

        .doc-title h2 {
            font-size: 32px;
            margin: 0 0 5px 0;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .meta-table {
            width: 100%;
            text-align: right;
            border-collapse: collapse;
        }

        .meta-table td {
            padding: 4px 0 4px 15px;
        }

        .meta-table td:first-child {
            color: var(--text-muted);
            font-weight: 500;
        }

        .meta-table td:last-child {
            font-weight: 600;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .info-box {
            width: 45%;
        }

        .info-box h3 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        
        .info-box p {
            margin: 4px 0;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .items-table th {
            background-color: var(--bg-light);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
        }

        .items-table th.right, .items-table td.right {
            text-align: right;
        }

        .items-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .totals-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 40px;
        }

        .totals-table {
            width: 300px;
            border-collapse: collapse;
        }

        .totals-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .totals-table tr.grand-total td {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-color);
            border-bottom: none;
            border-top: 2px solid var(--primary-color);
        }
        
        .totals-table td:first-child {
            color: var(--text-muted);
        }

        .totals-table td.right {
            text-align: right;
        }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.paid { background-color: #dcfce7; color: #166534; }
        .badge.partial { background-color: #fef08a; color: #854d0e; }
        .badge.unpaid { background-color: #fee2e2; color: #991b1b; }
        .badge.draft { background-color: #f3f4f6; color: #374151; }

    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
